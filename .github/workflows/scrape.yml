name: Scrape Demo

on:
  workflow_dispatch:

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run demo pipeline (ingesta + historico en SQLite)
        run: make run-demo

      - name: Upload exports and database
        uses: actions/upload-artifact@v4
        with:
          name: demo-pipeline-output
          path: |
            data/exports/
            data/processed/
