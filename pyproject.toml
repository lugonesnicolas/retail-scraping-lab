[project]
name = "retail-scraping-lab"
version = "0.1.0"
description = "Pipeline end-to-end de monitoreo de productos, precios y disponibilidad en retail: adquisicion, normalizacion, validacion, historico en SQL y dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nicolas Lugones" }]

dependencies = [
    "requests>=2.31",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    # >=1.49: el dashboard usa st.dataframe(width="stretch").
    "streamlit>=1.49",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.31",
]

[project.scripts]
retail-scraping-lab = "retail_scraping_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_scraping_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() en defaults es el patron idiomatico de Typer.
"src/retail_scraping_lab/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["retail_scraping_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "dashboard"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
